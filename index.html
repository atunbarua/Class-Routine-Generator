<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class Routine Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <h1>Class Routine Generator</h1>
        <p>Prepare tomorrow's class schedule</p>
    </header>


    <!-- DATE -->
    <section class="date-section">

        <button id="previousDay">‹</button>

        <div>
            <span class="label">Preparing Schedule For</span>
            <h2 id="scheduleDate">Loading...</h2>
        </div>

        <button id="nextDay">›</button>

    </section>


    <!-- SCHEDULE -->
    <main>

        <div class="section-title">

            <h2>Class Schedule</h2>

            <button id="resetSchedule">
                Reset
            </button>

        </div>


        <!-- SLOTS -->
        <div id="scheduleContainer"></div>


        <!-- MERGE CONTROLS -->
        <div class="merge-controls">

            <button id="mergeButton">
                Merge Selected Slots
            </button>

            <button id="unmergeButton">
                Unmerge
            </button>

        </div>


        <!-- CLASSROOM -->
        <section class="settings-section">

            <label for="classroom">
                Classroom
            </label>

            <select id="classroom">

                <option value="">
                    — Select Classroom —
                </option>

                <option value="C-1">C-1</option>
                <option value="C-2">C-2</option>
                <option value="C-3">C-3</option>

            </select>

        </section>


        <!-- NOTICE -->
        <section class="settings-section">

            <label for="notice">
                Notice <span>(Optional)</span>
            </label>

            <textarea
                id="notice"
                rows="3"
                placeholder="Write a special notice if needed..."
            ></textarea>

        </section>


        <!-- GENERATE -->
        <button
            id="generateButton"
            class="generate-button"
        >
            Generate Schedule
        </button>


        <!-- OUTPUT -->
        <section
            id="outputSection"
            class="output-section"
        >

            <div class="output-header">

                <h2>Generated Schedule</h2>

                <button id="copyButton">
                    Copy
                </button>

            </div>

            <pre id="output"></pre>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
