<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class Routine Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <h1>Class Routine Generator</h1>
            <p>Prepare tomorrow's class schedule</p>
        </header>


        <!-- Date Section -->
        <section class="date-section">

            <button id="previousDay">‹</button>

            <div>
                <span class="label">Preparing Schedule For</span>
                <h2 id="scheduleDate">Loading...</h2>
            </div>

            <button id="nextDay">›</button>

        </section>


        <!-- Schedule -->
        <main>

            <div class="section-title">
                <h2>Class Schedule</h2>
                <button id="resetSchedule">Reset</button>
            </div>


            <div id="scheduleContainer">

                <!-- Time slots will be generated by JavaScript -->

            </div>


            <!-- Classroom -->
            <section class="settings-section">

                <label for="classroom">
                    Classroom
                </label>

                <input
                    type="text"
                    id="classroom"
                    placeholder="e.g. C-3"
                >

            </section>


            <!-- Notice -->
            <section class="settings-section">

                <label for="notice">
                    Notice <span>(Optional)</span>
                </label>

                <textarea
                    id="notice"
                    placeholder="Write a special notice if needed..."
                    rows="3"
                ></textarea>

            </section>


            <!-- Generate -->
            <button id="generateButton" class="generate-button">
                Generate Schedule
            </button>


            <!-- Output -->
            <section id="outputSection" class="output-section">

                <div class="output-header">
                    <h2>Generated Schedule</h2>

                    <button id="copyButton">
                        Copy
                    </button>
                </div>

                <pre id="output"></pre>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
